services:
  db:
    image: postgres:18-alpine
    container_name: aicode-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: aicode
    ports:
      - "5432:5432"
    volumes:
      - aicode_pg_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d aicode"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
        - sentinal

  # One-shot migration. Runs once after `db` is healthy, then exits.
  # `api` waits on this via `service_completed_successfully`, so the
  # API container never starts on a half-migrated database.
  # migrate:
  #   build:
  #     context: .
  #     dockerfile: packages/api/Dockerfile
  #   image: aicode-api:dev
  #   container_name: aicode-migrate
  #   depends_on:
  #     db:
  #       condition: service_healthy
  #   env_file:
  #     - path: .env
  #       required: false
  #   environment:
  #     DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/aicode
  #   entrypoint: ["/app/docker/migrate.sh"]
  #   restart: "no"
  #
  # api:
  #   build:
  #     context: .
  #     dockerfile: packages/api/Dockerfile
  #   image: aicode-api:dev
  #   container_name: aicode-api
  #   depends_on:
  #     db:
  #       condition: service_healthy
  #     migrate:
  #       condition: service_completed_successfully
  #   env_file:
  #     - path: .env
  #       required: false
  #   environment:
  #     DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/aicode
  #     DBOS_EXECUTOR_ID: ${HOSTNAME:-aicode-api}
  #     CORS_ORIGINS: '["http://localhost:3000"]'
  #   ports:
  #     - "8000:8000"
  #   healthcheck:
  #     test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/health"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 5
  #     start_period: 15s
  #   restart: unless-stopped

volumes:
  aicode_pg_data:

networks:
  sentinal:
    name: sentinal-net
