services:
  db:
    image: postgres:18-alpine
    container_name: aicode-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: aicode
    ports:
      - "5432:5432"
    volumes:
      - aicode_pg_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d aicode"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  aicode_pg_data:
