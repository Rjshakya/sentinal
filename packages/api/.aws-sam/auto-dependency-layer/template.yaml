AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Sentinel API + durable review
Parameters:
  AppSecretStore:
    Type: String
    Description: Name or ARN of the SecretsManager secret holding the app JSON (DATABASE_URL,
      GITHUB_*, LLM_*, E2B_*, OPENAI_API_KEY, ...)
Globals:
  Function:
    MemorySize: 1024
    Timeout: 29
    Environment:
      Variables:
        PORT:
          Fn::Sub: '{{resolve:secretsmanager:${AppSecretStore}:SecretString:PORT}}'
        APP_ENV:
          Fn::Sub: '{{resolve:secretsmanager:${AppSecretStore}:SecretString:APP_ENV}}'
        APP_NAME:
          Fn::Sub: '{{resolve:secretsmanager:${AppSecretStore}:SecretString:APP_NAME}}'
        DATABASE_URL:
          Fn::Sub: '{{resolve:secretsmanager:${AppSecretStore}:SecretString:DATABASE_URL}}'
        CORS_ORIGINS:
          Fn::Sub: '{{resolve:secretsmanager:${AppSecretStore}:SecretString:CORS_ORIGINS}}'
        API_PREFIX:
          Fn::Sub: '{{resolve:secretsmanager:${AppSecretStore}:SecretString:API_PREFIX}}'
        USE_DURABLE: 'true'
        WORKOS_API_KEY:
          Fn::Sub: '{{resolve:secretsmanager:${AppSecretStore}:SecretString:WORKOS_API_KEY}}'
        WORKOS_CLIENT_ID:
          Fn::Sub: '{{resolve:secretsmanager:${AppSecretStore}:SecretString:WORKOS_CLIENT_ID}}'
        WORKOS_REDIRECT_URI:
          Fn::Sub: '{{resolve:secretsmanager:${AppSecretStore}:SecretString:WORKOS_REDIRECT_URI}}'
        WORKOS_COOKIE_PASSWORD:
          Fn::Sub: '{{resolve:secretsmanager:${AppSecretStore}:SecretString:WORKOS_COOKIE_PASSWORD}}'
        FRONTEND_URL:
          Fn::Sub: '{{resolve:secretsmanager:${AppSecretStore}:SecretString:FRONTEND_URL}}'
        GITHUB_APP_ID:
          Fn::Sub: '{{resolve:secretsmanager:${AppSecretStore}:SecretString:GITHUB_APP_ID}}'
        GITHUB_APP_CLIENT_ID:
          Fn::Sub: '{{resolve:secretsmanager:${AppSecretStore}:SecretString:GITHUB_APP_CLIENT_ID}}'
        GITHUB_APP_CLIENT_SECRET:
          Fn::Sub: '{{resolve:secretsmanager:${AppSecretStore}:SecretString:GITHUB_APP_CLIENT_SECRET}}'
        GITHUB_APP_SLUG:
          Fn::Sub: '{{resolve:secretsmanager:${AppSecretStore}:SecretString:GITHUB_APP_SLUG}}'
        GITHUB_APP_PRIVATE_KEY:
          Fn::Sub: '{{resolve:secretsmanager:${AppSecretStore}:SecretString:GITHUB_APP_PRIVATE_KEY}}'
        GITHUB_WEBHOOK_SECRET:
          Fn::Sub: '{{resolve:secretsmanager:${AppSecretStore}:SecretString:GITHUB_WEBHOOK_SECRET}}'
        GITHUB_INSTALL_STATE_SECRET:
          Fn::Sub: '{{resolve:secretsmanager:${AppSecretStore}:SecretString:GITHUB_INSTALL_STATE_SECRET}}'
        LLM_MODEL:
          Fn::Sub: '{{resolve:secretsmanager:${AppSecretStore}:SecretString:LLM_MODEL}}'
        LLM_API_KEY:
          Fn::Sub: '{{resolve:secretsmanager:${AppSecretStore}:SecretString:LLM_API_KEY}}'
        LLM_BASE_URL:
          Fn::Sub: '{{resolve:secretsmanager:${AppSecretStore}:SecretString:LLM_BASE_URL}}'
        LLM_DEFAULT_HEADERS:
          Fn::Sub: '{{resolve:secretsmanager:${AppSecretStore}:SecretString:LLM_DEFAULT_HEADERS}}'
        SANDBOX_PROVIDER:
          Fn::Sub: '{{resolve:secretsmanager:${AppSecretStore}:SecretString:SANDBOX_PROVIDER}}'
        E2B_API_KEY:
          Fn::Sub: '{{resolve:secretsmanager:${AppSecretStore}:SecretString:E2B_API_KEY}}'
        E2B_TEMPLATE:
          Fn::Sub: '{{resolve:secretsmanager:${AppSecretStore}:SecretString:E2B_TEMPLATE}}'
        DAYTONA_API_KEY:
          Fn::Sub: '{{resolve:secretsmanager:${AppSecretStore}:SecretString:DAYTONA_API_KEY}}'
        OPENAI_API_KEY:
          Fn::Sub: '{{resolve:secretsmanager:${AppSecretStore}:SecretString:OPENAI_API_KEY}}'
        INDEX_S3_BUCKET:
          Fn::Sub: '{{resolve:secretsmanager:${AppSecretStore}:SecretString:INDEX_S3_BUCKET}}'
        AWS_ACCESS_KEY_ID:
          Fn::Sub: '{{resolve:secretsmanager:${AppSecretStore}:SecretString:AWS_ACCESS_KEY_ID}}'
        AWS_SECRET_ACCESS_KEY:
          Fn::Sub: '{{resolve:secretsmanager:${AppSecretStore}:SecretString:AWS_SECRET_ACCESS_KEY}}'
        AWS_REGION:
          Fn::Sub: '{{resolve:secretsmanager:${AppSecretStore}:SecretString:AWS_REGION}}'
        AWS_ENDPOINT_URL:
          Fn::Sub: '{{resolve:secretsmanager:${AppSecretStore}:SecretString:AWS_ENDPOINT_URL}}'
        TRACELOOP_BASE_URL:
          Fn::Sub: '{{resolve:secretsmanager:${AppSecretStore}:SecretString:TRACELOOP_BASE_URL}}'
        TRACELOOP_API_KEY:
          Fn::Sub: '{{resolve:secretsmanager:${AppSecretStore}:SecretString:TRACELOOP_API_KEY}}'
        TRACELOOP_TRACE_CONTENT:
          Fn::Sub: '{{resolve:secretsmanager:${AppSecretStore}:SecretString:TRACELOOP_TRACE_CONTENT}}'
        TRACELOOP_DISABLE_BATCH:
          Fn::Sub: '{{resolve:secretsmanager:${AppSecretStore}:SecretString:TRACELOOP_DISABLE_BATCH}}'
Resources:
  ApiFunction:
    Type: AWS::Serverless::Function
    Metadata:
      DockerContext: C:\Users\rajka\Desktop\projects-2026\ai-code-review\packages\api
      Dockerfile: Dockerfile.lambda
      SamResourceId: ApiFunction
    Properties:
      PackageType: Image
      ImageConfig:
        Command:
        - main.handler
      Timeout: 29
      MemorySize: 1024
      Environment:
        Variables:
          REVIEW_OPENED_FUNCTION_NAME:
            Ref: ReviewOpenedFunction
          REVIEW_COMMENT_FUNCTION_NAME:
            Ref: ReviewCommentFunction
          REPAIR_DURABLE_FUNCTION_NAME:
            Ref: RepairDurableFunction
      Policies:
      - LambdaInvokePolicy:
          FunctionName:
            Ref: ReviewOpenedFunction
      - LambdaInvokePolicy:
          FunctionName:
            Ref: ReviewCommentFunction
      - LambdaInvokePolicy:
          FunctionName:
            Ref: RepairDurableFunction
      - SecretsManagerReadWrite
      FunctionUrlConfig:
        AuthType: NONE
      ImageUri: apifunction:latest
  ReviewOpenedFunction:
    Type: AWS::Serverless::Function
    Metadata:
      DockerContext: C:\Users\rajka\Desktop\projects-2026\ai-code-review\packages\api
      Dockerfile: Dockerfile.lambda
      SamResourceId: ReviewOpenedFunction
    Properties:
      PackageType: Image
      ImageConfig:
        Command:
        - app.workflows.durable.opened_handler.reviewOpenedHandler
      Timeout: 900
      MemorySize: 2048
      DurableConfig:
        ExecutionTimeout:
          Hours: 3
        RetentionPeriodInDays: 1
      Policies:
      - SecretsManagerReadWrite
      - AWSLambdaBasicDurableExecutionRole
      ImageUri: apifunction:latest
  ReviewCommentFunction:
    Type: AWS::Serverless::Function
    Metadata:
      DockerContext: C:\Users\rajka\Desktop\projects-2026\ai-code-review\packages\api
      Dockerfile: Dockerfile.lambda
      SamResourceId: ReviewCommentFunction
    Properties:
      PackageType: Image
      ImageConfig:
        Command:
        - app.workflows.durable.comment_handler.reviewCommentHandler
      Timeout: 900
      MemorySize: 2048
      DurableConfig:
        ExecutionTimeout:
          Hours: 3
        RetentionPeriodInDays: 1
      Policies:
      - SecretsManagerReadWrite
      - AWSLambdaBasicDurableExecutionRole
      ImageUri: apifunction:latest
  RepairDurableFunction:
    Type: AWS::Serverless::Function
    Metadata:
      DockerContext: C:\Users\rajka\Desktop\projects-2026\ai-code-review\packages\api
      Dockerfile: Dockerfile.lambda
      SamResourceId: RepairDurableFunction
    Properties:
      PackageType: Image
      ImageConfig:
        Command:
        - app.workflows.durable.repair_handler.repair_durable_handler
      Timeout: 900
      MemorySize: 2048
      DurableConfig:
        ExecutionTimeout:
          Hours: 3
        RetentionPeriodInDays: 1
      Policies:
      - SecretsManagerReadWrite
      - AWSLambdaBasicDurableExecutionRole
      ImageUri: apifunction:latest
