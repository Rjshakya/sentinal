[project]
name = "api"
version = "0.1.0"
description = "FastAPI backend for ai-code-review"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlmodel>=0.0.22",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic-settings>=2.6",
    "workos>=8.0",
    "githubkit>=0.16.0",
    "deepagents>=0.6.12",
    "daytona>=0.193.0",
    "e2b>=2.30.0",
    "openai>=2.44.0",
    "langchain-openai>=1.3.5",
    "langchain-anthropic>=1.4",
    "langchain-google-genai>=4.2",
    "langchain-e2b>=0.0.5",
    "dbos>=2.27.0",
    "langchain-deepseek>=1.1.0",
    "lancedb>=0.36.0",
    "traceloop-sdk>=0.62.3",
    "opentelemetry-instrumentation-fastapi>=0.65b0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"


[tool.black]
line-length = 88
target-version = ["py313"]



# Docker command to run api container
#
# docker run -d --name reviewpr-backend-api --restart unless-stopped `
#   --network sentinal-net `
#   --env-file packages/api/.env `
#   -e DATABASE_URL=postgresql+asyncpg://postgres:postgres@db:5432/aicode `
#   -e DBOS_DATABASE_URL=postgresql://postgres:postgres@db:5432/aicode `
#   -e TRACELOOP_BASE_URL=http://lgtm:4318 `
#   -p 8000:8000 `
#   reviewpr-backend-api:latest
