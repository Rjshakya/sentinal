[project]
name = "api"
version = "0.1.0"
description = "FastAPI backend for ai-code-review"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlmodel>=0.0.22",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic-settings>=2.6",
    "workos>=8.0",
    "githubkit>=0.16.0",
    "deepagents>=0.6.12",
    "daytona>=0.193.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[dependency-groups]
dev = [
    "cognee>=1.2.2",
    "tree-sitter-language-pack>=1.12.2",
]
