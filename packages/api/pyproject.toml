[project]
name = "api"
version = "0.1.0"
description = "FastAPI backend for ai-code-review"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlmodel>=0.0.22",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic-settings>=2.6",
    "workos>=8.0",
    "githubkit>=0.16.0",
    "deepagents>=0.6.12",
    "daytona>=0.193.0",
    "e2b>=2.30.0",
    "openai>=2.44.0",
    "langchain-openai>=1.3.5",
    "langchain-anthropic>=1.4",
    "langchain-google-genai>=4.2",
    "langchain-e2b>=0.0.5",
    "dbos>=2.27.0",
    "sentry-sdk>=2.66.1",
    "langchain-deepseek>=1.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[dependency-groups]
dev = []
