[project]
name = "sentinel-codegraph"
version = "0.3.0"
description = "Sentinel code graph CLI: tree-sitter nodes/edges into SQL"
readme = "README.md"
authors = [{ name = "Sentinel" }]
requires-python = ">=3.13"
dependencies = [
    # "ladybug>=0.20.4",
    "ladybug==0.19.1",
    "tree-sitter-language-pack>=1.20.0",
]

[project.scripts]
codegraph = "codegraph.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/codegraph"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.black]
line-length = 88
target-version = ["py313"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
