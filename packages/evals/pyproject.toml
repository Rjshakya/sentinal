[project]
name = "evals"
version = "0.1.0"
description = "Sentinel review-agent evaluation harness"
requires-python = ">=3.13"
dependencies = [
    "api",
    "httpx>=0.27",
    "langchain-core>=0.3",
    "pydantic>=2.6",
    "python-dotenv>=1.2.2",
]

[tool.uv.sources]
api = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agents"]
