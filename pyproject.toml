[project]
name = "ai-code-review"
version = "0.1.0"
description = "Monorepo root for ai-code-review"
readme = "README.md"
requires-python = ">=3.13"
dependencies = []

[tool.uv]
managed = true

[tool.uv.workspace]
members = ["packages/*"]

[tool.pyright]
venvPath = "."
venv = ".venv"

[tool.black]
line-length = 88
target-version = ["py313"]
